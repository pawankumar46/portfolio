<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0a0a0f;
        background-image:
          radial-gradient(40% 60% at 12% 20%, rgba(124, 58, 237, 0.65), transparent 70%),
          radial-gradient(35% 55% at 92% 85%, rgba(255, 77, 109, 0.45), transparent 70%);
        color: #f4f4f8;
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        box-sizing: border-box;
      }
      .top { display: flex; justify-content: space-between; font-size: 26px; color: #a1a1b5; }
      .name { font-family: "Space Grotesk", sans-serif; font-weight: 600; color: #fff; }
      .dot { color: #c6f432; }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 112px;
        line-height: 0.92;
        letter-spacing: -0.04em;
        margin: 0;
      }
      h1 span { color: #ff4d6d; }
      .bottom { font-size: 28px; color: #c6f432; }
    </style>
  </head>
  <body>
    <div class="top"><span class="name">Pawan Kumar<span class="dot">.</span></span><span>Front-End Engineer</span></div>
    <h1>Interfaces that feel <span>decisive.</span></h1>
    <div class="bottom">React · React Native · TypeScript</div>
  </body>
</html>
