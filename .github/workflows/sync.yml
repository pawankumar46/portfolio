      - name: Push to peer repo
        env:
          PEER: ${{ vars.PEER_REPO }}
          TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          PEER=$(echo "$PEER" | tr -d '[:space:]')
          TOKEN=$(echo "$TOKEN" | tr -d '[:space:]')
          git remote add peer "https://x-access-token:${TOKEN}@github.com/${PEER}.git"
          git push peer HEAD:${{ github.ref_name }}